name: Process Video Chunks

on:
  workflow_dispatch:
    inputs:

      target_ids:
        description: "Comma-separated User IDs (format: ID:TOPIC,ID:TOPIC)"
        required: true
        type: string

      server_url:
        description: "File server URL"
        required: true
        type: string

      auth_token:
        description: "File server auth token"
        required: true
        type: string

      job_id:
        description: "Orchestrator Job ID"
        required: true
        type: string

      worker_id:
        description: "Worker ID 01-15"
        required: true
        type: string

      total_jobs:
        description: "Total jobs"
        required: true
        type: string

      hashtag:
        description: "Hashtag for caption"
        required: false
        default: ""
        type: string

      video_list:
        description: "Comma-separated exact video paths relative to source root. Empty = all videos."
        required: false
        default: ""
        type: string

      source_id:
        description: "Canonical source directory identity generated by orchestrator"
        required: true
        type: string

      request_id:
        description: "Exact request identity generated by orchestrator"
        required: true
        type: string


# Only one active run per Worker repository.
concurrency:
  group: video-worker
  cancel-in-progress: false


jobs:

  process-chunk:

    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:

      # ======================================================
      # Checkout
      # ======================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ======================================================
      # System dependencies
      # ======================================================

      - name: Install System Dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            jq \
            curl \
            wget \
            aria2


      # ======================================================
      # Python dependencies
      # ======================================================

      - name: Install Python Dependencies
        shell: bash
        run: |
          set -euo pipefail

          python3 -m pip install \
            opencv-python \
            invisible-watermark \
            --break-system-packages


      # ======================================================
      # Download and install tdl
      # ======================================================

      - name: Download and Verify tdl
        shell: bash
        run: |
          set -euo pipefail

          echo "📦 Downloading tdl..."

          TDL_TMP="/tmp/tdl-install"

          rm -rf "$TDL_TMP"
          mkdir -p "$TDL_TMP"

          curl -fsSL \
            "https://github.com/iyear/tdl/releases/latest/download/tdl_Linux_64bit.tar.gz" \
            -o "$TDL_TMP/tdl.tar.gz"

          tar xzf \
            "$TDL_TMP/tdl.tar.gz" \
            -C "$TDL_TMP"

          TDL_BIN=""

          if [[ -x "$TDL_TMP/tdl" ]]; then

            TDL_BIN="$TDL_TMP/tdl"

          else

            TDL_BIN="$(
              find "$TDL_TMP" \
                -type f \
                -name "tdl" \
                -perm -u+x \
                -print \
                -quit
            )"

          fi

          if [[ -z "$TDL_BIN" || ! -f "$TDL_BIN" ]]; then

            echo "❌ tdl binary not found after extraction"

            echo "📂 Extracted files:"
            find "$TDL_TMP" \
              -maxdepth 3 \
              -type f \
              -print

            exit 1

          fi

          sudo install \
            -m 0755 \
            "$TDL_BIN" \
            /usr/local/bin/tdl

          rm -rf "$TDL_TMP"

          echo "✅ tdl installed"

          tdl version


      # ======================================================
      # Restore Worker-specific Telegram session
      # ======================================================

      - name: Restore Telegram Session
        shell: bash
        env:

          TDL_SESSIONS_B64: ${{ secrets.TDL_SESSIONS_B64 }}
          WORKER_ID: ${{ inputs.worker_id }}

        run: |
          set -euo pipefail

          if [[ -z "$TDL_SESSIONS_B64" ]]; then

            echo "❌ TDL_SESSIONS_B64 is missing"
            exit 1

          fi

          if [[ -z "$WORKER_ID" ]]; then

            echo "❌ worker_id is missing"
            exit 1

          fi

          # Convert:
          # 01 -> 1
          # 02 -> 2
          # ...
          # 15 -> 15

          WORKER_NUM=$((10#$WORKER_ID))

          NS="session_job_${WORKER_NUM}"

          STORAGE_PATH="/tmp/tdl-data/data"

          SESSION_FILE="$STORAGE_PATH/$NS"

          echo "=========================================="
          echo "Worker ID     : $WORKER_ID"
          echo "Worker number : $WORKER_NUM"
          echo "TDL namespace : $NS"
          echo "Storage path  : $STORAGE_PATH"
          echo "=========================================="

          rm -rf /tmp/tdl-data

          mkdir -p /tmp/tdl-data

          printf '%s' "$TDL_SESSIONS_B64" |
            base64 -d |
            tar xzf - \
              -C /tmp/tdl-data

          echo
          echo "📂 Restored files:"

          find /tmp/tdl-data \
            -maxdepth 3 \
            -type f \
            -printf '%p (%s bytes)\n'

          if [[ ! -f "$SESSION_FILE" ]]; then

            echo "❌ Session file not found:"
            echo "   $SESSION_FILE"

            exit 1

          fi

          echo
          echo "✅ Session file found:"
          echo "   $SESSION_FILE"

          echo
          echo "📦 Installing tdl-whoami..."

          if tdl extension install --force iyear/tdl-whoami; then

            echo "✅ tdl-whoami installed"

          else

            echo "⚠️ tdl-whoami installation failed"
            echo "⚠️ Continuing without whoami verification..."

          fi

          echo
          echo "🔎 Verifying Telegram session..."

          if command -v tdl >/dev/null 2>&1 &&
             tdl whoami \
               --storage "type=bolt,path=$STORAGE_PATH" \
               --ns "$NS" \
               >/tmp/tdl-whoami-output 2>&1; then

            cat /tmp/tdl-whoami-output

            if grep -qE "ID: [0-9]+" \
              /tmp/tdl-whoami-output; then

              echo "✅ Telegram session is valid: $NS"

            else

              echo "⚠️ whoami returned output but ID was not detected"
              echo "⚠️ Continuing..."

            fi

          else

            echo "⚠️ tdl whoami failed or is unavailable"
            echo "⚠️ This check is OPTIONAL"
            echo "⚠️ Continuing with restored session..."

          fi


      # ======================================================
      # Build exact source manifest
      # ======================================================

      - name: Build Exact Video Manifest
        id: manifest
        shell: bash

        env:

          SERVER_URL: ${{ inputs.server_url }}
          AUTH_TOKEN: ${{ inputs.auth_token }}

          VIDEO_LIST: ${{ inputs.video_list }}

          SOURCE_ID: ${{ inputs.source_id }}
          REQUEST_ID: ${{ inputs.request_id }}

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "BUILDING EXACT VIDEO MANIFEST"
          echo "=========================================="

          echo "Source ID : $SOURCE_ID"
          echo "Request ID: $REQUEST_ID"

          MANIFEST_DIR=".video-manifest"

          MANIFEST_FILE="$MANIFEST_DIR/manifest.tsv"
          CHECKSUM_FILE="$MANIFEST_DIR/checksums.tsv"

          rm -rf "$MANIFEST_DIR"

          mkdir -p "$MANIFEST_DIR"

          : > "$MANIFEST_FILE"
          : > "$CHECKSUM_FILE"


          # --------------------------------------------------
          # Determine exact source file paths.
          # --------------------------------------------------

          declare -a VIDEO_PATHS=()

          if [[ -n "$VIDEO_LIST" ]]; then

            echo
            echo "🎯 Using exact file list supplied by orchestrator"

            IFS=',' read -ra REQUESTED_PATHS <<< "$VIDEO_LIST"

            for VPATH in "${REQUESTED_PATHS[@]}"; do

              VPATH="$(echo "$VPATH" | xargs)"

              [[ -n "$VPATH" ]] || continue

              VIDEO_PATHS+=("$VPATH")

            done

          else

            echo
            echo "📋 No explicit file list."
            echo "📋 Requesting complete file list from server..."

            RESPONSE="$(
              curl -fsS \
                --max-time 30 \
                "${SERVER_URL}/list?token=$(jq -rn \
                  --arg token "$AUTH_TOKEN" \
                  '$token | @uri')"
            )"

            if [[ -z "$RESPONSE" ||
                  "$RESPONSE" == "[]" ]]; then

              echo "❌ Server returned no videos"
              exit 1

            fi

            mapfile -t VIDEO_PATHS < <(
              jq -r '.[].path' <<< "$RESPONSE"
            )

          fi


          # --------------------------------------------------
          # Require at least one source file.
          # --------------------------------------------------

          if [[ "${#VIDEO_PATHS[@]}" -eq 0 ]]; then

            echo "❌ No videos selected"
            exit 1

          fi


          # --------------------------------------------------
          # Validate every exact path and obtain source SHA256.
          # --------------------------------------------------

          for VPATH in "${VIDEO_PATHS[@]}"; do

            VPATH="$(echo "$VPATH" | xargs)"

            [[ -n "$VPATH" ]] || continue


            # Never allow absolute paths.

            if [[ "$VPATH" = /* ]]; then

              echo "❌ Absolute path rejected:"
              echo "   $VPATH"

              exit 1

            fi


            # Never allow traversal.

            case "/$VPATH/" in

              */../*)

                echo "❌ Path traversal rejected:"
                echo "   $VPATH"

                exit 1

                ;;

            esac


            # Normalize ./foo -> foo.

            VPATH="${VPATH#./}"


            echo
            echo "🔎 Verifying source:"
            echo "   $VPATH"


            # ------------------------------------------------
            # Ask server for authoritative checksum.
            # ------------------------------------------------

            CHECKSUM_RESPONSE="$(
              curl -fsS \
                --max-time 30 \
                --get \
                --data-urlencode "path=$VPATH" \
                --data-urlencode "token=$AUTH_TOKEN" \
                "$SERVER_URL/checksum"
            )"


            EXPECTED_SHA="$(
              jq -r '.checksum // empty' \
                <<< "$CHECKSUM_RESPONSE"
            )"


            if [[ ! "$EXPECTED_SHA" =~ ^[a-fA-F0-9]{64}$ ]]; then

              echo "❌ Invalid SHA-256 returned by server:"
              echo "   File: $VPATH"
              echo "   SHA : $EXPECTED_SHA"

              exit 1

            fi


            # ------------------------------------------------
            # Store exact path + SHA.
            # ------------------------------------------------

            printf '%s\n' \
              "$VPATH" \
              >> "$MANIFEST_FILE"

            printf '%s\t%s\n' \
              "$VPATH" \
              "$EXPECTED_SHA" \
              >> "$CHECKSUM_FILE"

          done


          # --------------------------------------------------
          # Deduplicate manifest while preserving exact path.
          # --------------------------------------------------

          sort -u \
            "$MANIFEST_FILE" \
            -o "$MANIFEST_FILE"

          sort -u \
            "$CHECKSUM_FILE" \
            -o "$CHECKSUM_FILE"


          # --------------------------------------------------
          # Manifest count.
          # --------------------------------------------------

          VIDEO_COUNT="$(
            wc -l < "$MANIFEST_FILE"
          )"

          if [[ "$VIDEO_COUNT" -lt 1 ]]; then

            echo "❌ Manifest is empty"
            exit 1

          fi


          # --------------------------------------------------
          # Generate checksum identity.
          #
          # Request ID is already supplied by orchestrator,
          # but the manifest itself is independently hashed.
          # --------------------------------------------------

          MANIFEST_HASH="$(
            {
              printf 'SOURCE_ID=%s\n' "$SOURCE_ID"
              printf 'REQUEST_ID=%s\n' "$REQUEST_ID"
              cat "$CHECKSUM_FILE"
            } |
              sha256sum |
              awk '{print $1}'
          )"


          echo
          echo "✅ Manifest created"
          echo "   Files : $VIDEO_COUNT"
          echo "   Hash  : $MANIFEST_HASH"

          echo
          echo "📋 Exact files:"
          cat "$MANIFEST_FILE"

          echo

          echo "manifest_file=$MANIFEST_FILE" >> "$GITHUB_OUTPUT"
          echo "checksum_file=$CHECKSUM_FILE" >> "$GITHUB_OUTPUT"
          echo "count=$VIDEO_COUNT" >> "$GITHUB_OUTPUT"
          echo "hash=$MANIFEST_HASH" >> "$GITHUB_OUTPUT"


      # ======================================================
      # Restore ONLY request-specific cache
      # ======================================================

      - name: Restore Verified Video Cache
        id: video-cache
        uses: actions/cache@v4

        with:

          path: .video-cache

          key: >-
            videos-cache-v2-
            ${{ inputs.source_id }}-
            ${{ inputs.request_id }}-
            ${{ steps.manifest.outputs.hash }}

          lookup-only: false


      # ======================================================
      # Reset runtime ./videos completely
      # ======================================================

      - name: Reset Runtime Video Directory
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "RESETTING ./videos"
          echo "=========================================="

          # IMPORTANT:
          # ./videos is NEVER trusted as existing state.
          # Every job starts with a clean processing directory.

          rm -rf ./videos

          mkdir -p ./videos

          echo "✅ ./videos deleted and recreated"

          echo

          ls -la ./videos


      # ======================================================
      # Validate cache and materialize exact files
      # ======================================================

      - name: Validate Cache And Materialize Videos
        shell: bash

        env:
          MANIFEST_FILE: ${{ steps.manifest.outputs.manifest_file }}
          CHECKSUM_FILE: ${{ steps.manifest.outputs.checksum_file }}

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "CACHE VALIDATION"
          echo "=========================================="

          CACHE_DIR=".video-cache"

          mkdir -p "$CACHE_DIR"
          mkdir -p ./videos


          # --------------------------------------------------
          # SECURITY CHECK:
          #
          # Every cached file MUST be present in the exact
          # requested manifest.
          # --------------------------------------------------

          echo "🔒 Checking for unexpected cache files..."

          while IFS= read -r -d '' CACHED_FILE; do

            RELATIVE_PATH="${CACHED_FILE#"$CACHE_DIR"/}"

            if ! grep -Fxq \
              "$RELATIVE_PATH" \
              "$MANIFEST_FILE"; then

              echo "❌ Unexpected cached file detected:"
              echo "   $RELATIVE_PATH"

              echo
              echo "The cache contains a file which was not"
              echo "requested by this job."

              exit 1

            fi

          done < <(
            find "$CACHE_DIR" \
              -type f \
              -print0
          )


          # --------------------------------------------------
          # Materialize each exact requested file.
          # --------------------------------------------------

          MISSING_COUNT=0

          while IFS=$'\t' read -r VPATH EXPECTED_SHA; do

            [[ -n "$VPATH" ]] || continue


            CACHED_FILE="$CACHE_DIR/$VPATH"
            OUTPUT_FILE="./videos/$VPATH"


            # ------------------------------------------------
            # Cache hit candidate.
            # ------------------------------------------------

            if [[ -f "$CACHED_FILE" ]]; then

              ACTUAL_SHA="$(
                sha256sum "$CACHED_FILE" |
                  awk '{print $1}'
              )"


              if [[ "$ACTUAL_SHA" == "$EXPECTED_SHA" ]]; then

                echo "⚡ VERIFIED CACHE HIT"
                echo "   $VPATH"
                echo "   SHA256: $ACTUAL_SHA"

                mkdir -p \
                  "$(dirname "$OUTPUT_FILE")"

                cp -f \
                  "$CACHED_FILE" \
                  "$OUTPUT_FILE"

                continue

              fi


              echo "⚠️ CACHE SHA256 MISMATCH"
              echo "   File    : $VPATH"
              echo "   Expected: $EXPECTED_SHA"
              echo "   Actual  : $ACTUAL_SHA"

              rm -f "$CACHED_FILE"

            fi


            MISSING_COUNT=$((MISSING_COUNT + 1))

          done < "$CHECKSUM_FILE"


          echo
          echo "📊 Missing from cache: $MISSING_COUNT"


          # --------------------------------------------------
          # Report whether download is required.
          # --------------------------------------------------

          echo \
            "missing_count=$MISSING_COUNT" \
            >> "$GITHUB_ENV"


      # ======================================================
      # Download exact missing files
      # ======================================================

      - name: Download Missing Videos
        if: env.missing_count != '0'

        shell: bash

        env:

          SERVER_URL: ${{ inputs.server_url }}
          AUTH_TOKEN: ${{ inputs.auth_token }}

          MANIFEST_FILE: ${{ steps.manifest.outputs.manifest_file }}
          CHECKSUM_FILE: ${{ steps.manifest.outputs.checksum_file }}

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "DOWNLOADING MISSING VIDEOS"
          echo "=========================================="


          while IFS=$'\t' read -r VPATH EXPECTED_SHA; do

            [[ -n "$VPATH" ]] || continue


            OUTPUT_FILE="./videos/$VPATH"


            # ------------------------------------------------
            # Already materialized from a verified cache.
            # ------------------------------------------------

            if [[ -f "$OUTPUT_FILE" ]]; then

              ACTUAL_SHA="$(
                sha256sum "$OUTPUT_FILE" |
                  awk '{print $1}'
              )"

              if [[ "$ACTUAL_SHA" == "$EXPECTED_SHA" ]]; then
                continue
              fi

              rm -f "$OUTPUT_FILE"

            fi


            mkdir -p \
              "$(dirname "$OUTPUT_FILE")"


            echo
            echo "📥 Downloading:"
            echo "   $VPATH"


            DOWNLOADED=0


            for ATTEMPT in 1 2 3; do

              echo
              echo "Attempt: $ATTEMPT / 3"


              rm -f "$OUTPUT_FILE"


              DOWNLOAD_URL="$(
                python3 - \
                  "$SERVER_URL/download" \
                  "$VPATH" \
                  "$AUTH_TOKEN" <<'PY'
import sys
import urllib.parse

base = sys.argv[1]
path = sys.argv[2]
token = sys.argv[3]

query = urllib.parse.urlencode({
    "path": path,
    "token": token,
})

print(f"{base}?{query}")
PY
              )"


              if aria2c \
                --dir="$(dirname "$OUTPUT_FILE")" \
                --out="$(basename "$OUTPUT_FILE")" \
                --max-connection-per-server=16 \
                --split=16 \
                --min-split-size=1M \
                --max-tries=3 \
                --retry-wait=2 \
                --timeout=60 \
                --file-allocation=none \
                --summary-interval=5 \
                "$DOWNLOAD_URL"; then


                if [[ -f "$OUTPUT_FILE" ]]; then

                  ACTUAL_SHA="$(
                    sha256sum "$OUTPUT_FILE" |
                      awk '{print $1}'
                  )


                  if [[ "$ACTUAL_SHA" == "$EXPECTED_SHA" ]]; then

                    echo
                    echo "✅ DOWNLOAD VERIFIED"
                    echo "   File: $VPATH"
                    echo "   SHA : $ACTUAL_SHA"

                    DOWNLOADED=1

                    break

                  fi


                  echo
                  echo "❌ SHA256 mismatch"
                  echo "   File    : $VPATH"
                  echo "   Expected: $EXPECTED_SHA"
                  echo "   Actual  : $ACTUAL_SHA"


                else

                  echo "⚠️ aria2c finished but file is missing"

                fi

              else

                echo "⚠️ aria2c failed"

              fi


              rm -f "$OUTPUT_FILE"

              sleep 3

            done


            if [[ "$DOWNLOADED" -ne 1 ]]; then

              echo
              echo "❌ Could not obtain verified video:"
              echo "   $VPATH"

              exit 1

            fi

          done < "$CHECKSUM_FILE"


          echo
          echo "✅ Download phase completed"


      # ======================================================
      # Final strict ./videos whitelist + checksum validation
      # ======================================================

      - name: Final Video Integrity Check
        shell: bash

        env:

          MANIFEST_FILE: ${{ steps.manifest.outputs.manifest_file }}
          CHECKSUM_FILE: ${{ steps.manifest.outputs.checksum_file }}

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "FINAL VIDEO INTEGRITY CHECK"
          echo "=========================================="


          EXPECTED_COUNT="$(
            wc -l < "$MANIFEST_FILE"
          )"


          ACTUAL_COUNT="$(
            find ./videos \
              -type f \
              -print |
            sed 's#^\./videos/##' |
            sort |
            wc -l
          )"


          echo "Expected files: $EXPECTED_COUNT"
          echo "Actual files  : $ACTUAL_COUNT"


          if [[ "$EXPECTED_COUNT" -ne "$ACTUAL_COUNT" ]]; then

            echo
            echo "❌ FILE COUNT MISMATCH"

            echo
            echo "Expected:"
            cat "$MANIFEST_FILE"

            echo
            echo "Actual:"
            find ./videos \
              -type f \
              -print |
            sed 's#^\./videos/##' |
            sort

            exit 1

          fi


          # --------------------------------------------------
          # Exact path + checksum check.
          # --------------------------------------------------

          while IFS=$'\t' read -r VPATH EXPECTED_SHA; do

            [[ -n "$VPATH" ]] || continue


            OUTPUT_FILE="./videos/$VPATH"


            if [[ ! -f "$OUTPUT_FILE" ]]; then

              echo "❌ Requested file missing:"
              echo "   $VPATH"

              exit 1

            fi


            ACTUAL_SHA="$(
              sha256sum "$OUTPUT_FILE" |
                awk '{print $1}'
            )"


            if [[ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]]; then

              echo
              echo "❌ FINAL SHA256 MISMATCH"
              echo "   File    : $VPATH"
              echo "   Expected: $EXPECTED_SHA"
              echo "   Actual  : $ACTUAL_SHA"

              exit 1

            fi


          done < "$CHECKSUM_FILE"


          # --------------------------------------------------
          # Verify there are NO extra files.
          # --------------------------------------------------

          while IFS= read -r -d '' ACTUAL_FILE; do

            RELATIVE_PATH="${ACTUAL_FILE#./videos/}"

            if ! grep -Fxq \
              "$RELATIVE_PATH" \
              "$MANIFEST_FILE"; then

              echo
              echo "❌ UNEXPECTED FILE IN ./videos:"
              echo "   $RELATIVE_PATH"

              exit 1

            fi

          done < <(
            find ./videos \
              -type f \
              -print0
          )


          echo
          echo "✅ FINAL VERIFICATION PASSED"
          echo "✅ ./videos contains ONLY requested files"
          echo "✅ Every file matches authoritative SHA256"


      # ======================================================
      # Debug upload endpoint
      # ======================================================

      - name: Debug upload endpoint
        shell: bash

        env:

          SERVER_URL: ${{ inputs.server_url }}
          AUTH_TOKEN: ${{ inputs.auth_token }}

          WORKER_ID: ${{ inputs.worker_id }}
          JOB_ID: ${{ inputs.job_id }}

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "UPLOAD ENDPOINT DEBUG"
          echo "=========================================="

          echo
          echo "SERVER_URL=[$SERVER_URL]"
          echo "WORKER_ID=[$WORKER_ID]"
          echo "JOB_ID=[$JOB_ID]"
          echo

          # --------------------------------------------------
          # 1. Authentication test
          # --------------------------------------------------

          echo "=== 1. ROOT WITHOUT TOKEN ==="

          RESPONSE="$(
            curl -sS \
              --max-time 15 \
              -w $'\n%{http_code}' \
              "$SERVER_URL/" \
              || true
          )"

          HTTP_CODE="${RESPONSE##*$'\n'}"
          BODY="${RESPONSE%$'\n'*}"

          echo "HTTP CODE: $HTTP_CODE"
          echo "BODY: $BODY"

          if [[ "$HTTP_CODE" != "403" ]]; then
            echo "❌ Expected 403 without token"
            exit 1
          fi

          echo "✅ Authentication rejection works"


          # --------------------------------------------------
          # 2. Authenticated request
          # --------------------------------------------------

          echo
          echo "=== 2. ROOT WITH TOKEN ==="

          RESPONSE="$(
            curl -sS \
              --max-time 15 \
              -w $'\n%{http_code}' \
              "${SERVER_URL}/?token=${AUTH_TOKEN}" \
              || true
          )"

          HTTP_CODE="${RESPONSE##*$'\n'}"
          BODY="${RESPONSE%$'\n'*}"

          echo "HTTP CODE: $HTTP_CODE"
          echo "BODY: $BODY"

          if [[ "$HTTP_CODE" != "404" ]]; then
            echo "❌ Expected 404 for authenticated /"
            exit 1
          fi

          echo "✅ Token authentication works"


          # --------------------------------------------------
          # 3. Health endpoint
          # --------------------------------------------------

          echo
          echo "=== 3. HEALTH WITH TOKEN ==="

          RESPONSE="$(
            curl -sS \
              --max-time 15 \
              -w $'\n%{http_code}' \
              "${SERVER_URL}/health?token=${AUTH_TOKEN}" \
              || true
          )"

          HTTP_CODE="${RESPONSE##*$'\n'}"
          BODY="${RESPONSE%$'\n'*}"

          echo "HTTP CODE: $HTTP_CODE"
          echo "BODY: $BODY"

          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "❌ Health endpoint failed"
            exit 1
          fi

          if [[ "$BODY" != "OK" ]]; then
            echo "❌ Unexpected health response"
            exit 1
          fi

          echo "✅ Health endpoint works"


          # --------------------------------------------------
          # 4. OPTIONS
          # --------------------------------------------------

          echo
          echo "=== 4. ENQUEUE OPTIONS ==="

          RESPONSE="$(
            curl -sS \
              --max-time 15 \
              -i \
              -X OPTIONS \
              "${SERVER_URL}/upload/enqueue?token=${AUTH_TOKEN}" \
              || true
          )"

          echo "$RESPONSE"

          if ! printf '%s\n' "$RESPONSE" |
              grep -q \
                '^HTTP/1.0 204 No Content\|^HTTP/1.1 204 No Content'; then

            echo "❌ OPTIONS endpoint failed"
            exit 1

          fi

          echo "✅ OPTIONS works"


          # --------------------------------------------------
          # 5. No real enqueue
          # --------------------------------------------------

          echo
          echo "=== 5. ENQUEUE TEST ==="

          echo "⚠️ Skipping real enqueue."
          echo "No fake upload job will be inserted into the queue."


          echo
          echo "=========================================="
          echo "ALL NON-DESTRUCTIVE DEBUG TESTS PASSED"
          echo "=========================================="


      # ======================================================
      # Run action_tag.sh
      # ======================================================

      - name: Run action_tag.sh
        shell: bash

        env:

          JOB_ID: ${{ inputs.job_id }}
          WORKER_ID: ${{ inputs.worker_id }}

          SOURCE_ID: ${{ inputs.source_id }}
          REQUEST_ID: ${{ inputs.request_id }}

          TDL_STORAGE: "type=bolt,path=/tmp/tdl-data/data"

          STORAGE_FORUM_CHAT: "-1003574423862"

          SERVER_URL: ${{ inputs.server_url }}
          AUTH_TOKEN: ${{ inputs.auth_token }}

          HASHTAG: ${{ inputs.hashtag }}

        run: |
          set -euo pipefail

          WORKER_NUM=$((10#$WORKER_ID))

          export TDL_NS="session_job_${WORKER_NUM}"


          echo "=========================================="
          echo "WORKER"
          echo "=========================================="
          echo "Worker ID  : $WORKER_ID"
          echo "Job ID     : $JOB_ID"
          echo "Source ID  : $SOURCE_ID"
          echo "Request ID : $REQUEST_ID"
          echo "TDL NS     : $TDL_NS"
          echo "=========================================="


          chmod +x ./action_tag.sh


          # --------------------------------------------------
          # User IDs
          # --------------------------------------------------

          IFS=',' read -ra IDS <<< "${{ inputs.target_ids }}"

          ID_ARGS=()


          for id in "${IDS[@]}"; do

            id="$(echo "$id" | xargs)"

            [[ -n "$id" ]] || continue

            ID_ARGS+=(
              --id
              "$id"
            )

          done


          # --------------------------------------------------
          # Hashtag
          # --------------------------------------------------

          HASHTAG_ARGS=()


          if [[ -n "$HASHTAG" ]]; then

            HASHTAG_ARGS=(
              --hashtag
              "$HASHTAG"
            )

          fi


          # --------------------------------------------------
          # Explicit processing root.
          #
          # Final integrity validation has already guaranteed
          # ./videos contains only the requested source files.
          # --------------------------------------------------

          echo
          echo "📂 Processing directory:"
          echo "   $(pwd)/videos"

          echo
          echo "📋 Verified files:"

          find ./videos \
            -type f \
            -print |
          sort


          echo
          echo "🚀 Starting action_tag.sh"


          ./action_tag.sh \
            "${ID_ARGS[@]}" \
            "${HASHTAG_ARGS[@]}" \
            ./videos/


      # ======================================================
      # Notify completion
      # ======================================================

      - name: Notify completion
        if: always()
        shell: bash

        env:

          SERVER_URL: ${{ inputs.server_url }}
          AUTH_TOKEN: ${{ inputs.auth_token }}

          JOB_ID: ${{ inputs.job_id }}
          WORKER_ID: ${{ inputs.worker_id }}

        run: |

          STATUS="success"

          if [[ "${{ job.status }}" != "success" ]]; then

            STATUS="failed"

          fi


          echo "📤 Completion notification"

          echo "   Job    : $JOB_ID"
          echo "   Worker : $WORKER_ID"
          echo "   Status : $STATUS"


          PAYLOAD="$(
            jq -cn \
              --arg job_id "$JOB_ID" \
              --arg worker_id "$WORKER_ID" \
              --arg status "$STATUS" \
              '{
                job_id: $job_id,
                worker_id: $worker_id,
                status: $status
              }'
          )"


          curl \
            -sS \
            -m 15 \
            -X POST \
            "${SERVER_URL}/complete?token=$(jq -rn \
              --arg token "$AUTH_TOKEN" \
              '$token | @uri')" \
            -H "Content-Type: application/json" \
            --data-binary "$PAYLOAD" \
            >/dev/null 2>&1 || true

